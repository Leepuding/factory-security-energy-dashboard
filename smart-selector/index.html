<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a6fe8">
  <title>智能选型平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff4ff;
      --primary-dark: #1d4ed8;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --secondary: #f97316;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --bg: #f0f2f7;
      --bg-soft: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border: #e8ecf3;
      --border-dark: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
      --shadow: 0 4px 16px rgba(0,0,0,0.05), 0 1px 4px rgba(0,0,0,0.03);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
      --shadow-primary: 0 8px 24px rgba(37,99,235,0.25);
      --radius: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
    }

    #app-root {
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
      padding-bottom: calc(60px + var(--safe-bottom));
      box-shadow: 0 0 60px rgba(0,0,0,0.06);
    }

    .page {
      display: none;
      min-height: 100vh;
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
    }

    .header.primary {
      background: var(--primary-gradient);
      color: #fff;
      border-bottom: none;
    }

    .header .back,
    .header .action {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .header .back:active,
    .header .action:active {
      background: rgba(0,0,0,0.06);
    }

    .header .title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }

    .header .actions {
      display: flex;
      gap: 4px;
    }

    .header .action-text {
      width: auto;
      height: 36px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .header .action-text:active {
      background: rgba(0,0,0,0.06);
    }

    /* Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      height: calc(58px + var(--safe-bottom));
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 6px;
      z-index: 200;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.04);
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-tertiary);
      font-size: 10px;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.2s;
    }

    .tab-item.active {
      color: var(--primary);
    }

    .tab-item .icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      position: relative;
      transition: transform 0.2s;
    }

    .tab-item.active .icon {
      transform: scale(1.1) translateY(-1px);
    }

    .tab-item .badge {
      position: absolute;
      top: -4px;
      right: -6px;
      min-width: 16px;
      height: 16px;
      background: var(--error);
      color: #fff;
      border-radius: 8px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 2px 6px rgba(239,68,68,0.35);
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: var(--radius-lg);
      margin: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.01em;
    }

    .section-title .more {
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 22px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.02em;
    }

    .btn:active { transform: scale(0.97); }
    .btn-block { width: 100%; }
    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: var(--shadow-primary);
    }
    .btn-secondary { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); color: #fff; box-shadow: 0 8px 24px rgba(249,115,22,0.25); }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-ghost { background: var(--bg); color: var(--text-secondary); }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 16px; }
    .btn-lg { padding: 15px 28px; font-size: 16px; border-radius: 28px; }

    /* Form Elements */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--bg-soft);
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }

    .form-input.error,
    .form-textarea.error {
      border-color: var(--error);
      background: #fef2f2;
    }

    .error-text {
      color: var(--error);
      font-size: 12px;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 14px;
    }
    .input-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--bg-soft);
      outline: none;
      transition: all 0.2s;
    }
    .input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }

    .form-textarea {
      min-height: 80px;
      resize: none;
    }

    /* Tags */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 500;
    }

    .tag-outline {
      background: #fff;
      border: 1px solid var(--border-dark);
      color: var(--text-secondary);
    }

    .tag.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Product Cards */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .product-card:active {
      transform: scale(0.97);
      box-shadow: var(--shadow);
    }

    .product-card .img {
      height: 110px;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 12px;
      overflow: hidden;
    }

    .product-card .img img,
    .detail-img img,
    .cart-item .img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .series-thumb {
      width: 64px;
      height: 56px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .series-thumb img {
      width: 118%;
      height: 118%;
      object-fit: contain;
      display: block;
    }

    .product-card .info {
      padding: 11px;
    }

    .product-card .name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-card .series {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* List Items */
    .list-item {
      display: flex;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .list-item:active {
      background: var(--bg-soft);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item .icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 13px;
      font-size: 18px;
    }

    .list-item .content {
      flex: 1;
    }

    .list-item .title {
      font-size: 14px;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .list-item .subtitle {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .list-item .arrow {
      color: var(--text-tertiary);
      font-size: 16px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15,23,42,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 414px;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
    }

    .modal-sheet::before {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      background: var(--border-dark);
      border-radius: 2px;
      margin: 8px auto 0;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 1;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-tertiary);
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.15s;
    }

    .modal-close:active {
      background: var(--bg);
    }

    .modal-body {
      padding: 18px;
      max-height: 60vh;
      overflow-y: auto;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15,23,42,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 13px 22px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .toast.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 20px;
      color: var(--text-tertiary);
    }

    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 18px;
      opacity: 0.4;
    }

    .empty-state .text {
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 50px;
      z-index: 99;
    }

    .tab {
      flex: 1;
      padding: 13px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      position: relative;
      cursor: pointer;
      transition: color 0.2s;
    }

    .tab.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 30%;
      width: 40%;
      height: 3px;
      background: var(--primary-gradient);
      border-radius: 2px;
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-pending { background: #fffbeb; color: #d97706; }
    .status-processing { background: #eff6ff; color: #2563eb; }
    .status-completed { background: #f0fdf4; color: #16a34a; }
    .status-closed { background: #f8fafc; color: #94a3b8; }

    /* Chat bubble */
    .chat-msg {
      display: flex;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .chat-msg.user {
      flex-direction: row-reverse;
    }

    .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      font-weight: 600;
    }

    .chat-msg.user .chat-avatar {
      background: var(--primary-gradient);
      color: #fff;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: var(--radius-lg);
      margin: 0 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.65;
      box-shadow: var(--shadow-sm);
    }

    .chat-msg.user .chat-bubble {
      background: var(--primary-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: var(--shadow-primary);
    }

    /* Loading */
    .loading-dots {
      display: flex;
      gap: 5px;
      padding: 8px 0;
    }

    .loading-dots span {
      width: 9px;
      height: 9px;
      background: var(--primary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Senior visual polish layer */
    :root {
      --primary: #1f5eff;
      --primary-light: #eef4ff;
      --primary-dark: #173fbd;
      --primary-gradient: linear-gradient(135deg, #2f7cff 0%, #1f5eff 48%, #143fb5 100%);
      --secondary: #f57c2c;
      --bg: #eef3fb;
      --bg-soft: #f7faff;
      --card: #ffffff;
      --text: #111827;
      --text-secondary: #5f6f85;
      --text-tertiary: #9aa8bc;
      --border: #e5ebf5;
      --border-dark: #c7d2e5;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 8px 20px rgba(27,46,88,0.04);
      --shadow: 0 10px 28px rgba(27,46,88,0.08), 0 2px 8px rgba(15,23,42,0.04);
      --shadow-lg: 0 20px 56px rgba(27,46,88,0.14), 0 6px 18px rgba(15,23,42,0.06);
      --shadow-primary: 0 12px 28px rgba(31,94,255,0.25);
      --radius: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, rgba(31,94,255,0.12), transparent 34%),
        linear-gradient(180deg, #f7faff 0%, #eef3fb 46%, #eaf0f8 100%);
    }

    #app-root {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(246,249,254,0.78) 36%, rgba(238,243,251,0.95) 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.8), 0 24px 80px rgba(24,39,75,0.12);
    }

    .header {
      height: 52px;
      background: rgba(255,255,255,0.86);
      border-bottom: 1px solid rgba(203,213,225,0.58);
      box-shadow: 0 8px 24px rgba(15,23,42,0.04);
    }

    .header.primary {
      background: linear-gradient(135deg, #2f7cff 0%, #1f5eff 58%, #173fbd 100%);
      box-shadow: 0 10px 26px rgba(31,94,255,0.22);
    }

    .header .back,
    .header .action {
      background: rgba(255,255,255,0.08);
    }

    .tab-bar {
      background: rgba(255,255,255,0.88);
      border-top: 1px solid rgba(203,213,225,0.62);
      box-shadow: 0 -12px 36px rgba(27,46,88,0.09);
    }

    .tab-item .icon {
      border-radius: 13px;
    }

    .tab-item.active .icon {
      background: var(--primary-light);
      box-shadow: inset 0 0 0 1px rgba(31,94,255,0.12);
    }

    .card,
    .quick-grid,
    .selection-card,
    .work-order-card,
    .result-card {
      border: 1px solid rgba(226,232,240,0.9);
      box-shadow: var(--shadow);
    }

    .card {
      padding: 18px;
      margin: 12px 12px 14px;
    }

    .section-title {
      font-size: 17px;
      letter-spacing: 0;
    }

    .section-title .more {
      color: var(--primary);
      font-weight: 600;
    }

    .btn {
      min-height: 40px;
      border-radius: 999px;
      box-shadow: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #357fff 0%, #1f5eff 52%, #1747c9 100%);
      box-shadow: var(--shadow-primary);
    }

    .btn-outline {
      background: rgba(255,255,255,0.92);
      border-color: rgba(31,94,255,0.55);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
    }

    .btn-ghost {
      background: #f1f5fb;
    }

    .form-input,
    .form-textarea,
    .form-select,
    .input {
      border: 1px solid #d8e2f0;
      border-radius: 14px;
      background: #f8fbff;
      box-shadow: inset 0 1px 2px rgba(15,23,42,0.03);
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus,
    .input:focus {
      box-shadow: 0 0 0 4px rgba(31,94,255,0.11), inset 0 1px 2px rgba(15,23,42,0.02);
    }

    .tag,

    /* Page specific styles */
    .home-header {
      background: linear-gradient(160deg, #3b82f6 0%, #2563eb 40%, #1d4ed8 100%);
      color: #fff;
      padding: 14px 14px 18px;
      border-radius: 0 0 24px 24px;
    }

    .home-search {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 22px;
      padding: 10px 16px;
      color: rgba(255,255,255,0.92);
      font-size: 13px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .home-banner {
      height: 140px;
      background: #1d4ed8;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .home-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(15,23,42,0.58) 0%, rgba(30,64,175,0.34) 48%, rgba(15,23,42,0.18) 100%);
      z-index: 1;
    }

    .home-banner::after {
      content: none;
    }

    .banner-track {
      position: absolute;
      inset: 0;
      display: flex;
      width: 300%;
      animation: bannerSlide 12s infinite;
    }

    .banner-slide {
      width: 33.333%;
      height: 100%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .banner-content {
      position: relative;
      z-index: 2;
      text-align: center;
      text-shadow: 0 2px 10px rgba(15,23,42,0.35);
    }

    .banner-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 2;
    }

    .banner-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.52);
      animation: bannerDot 12s infinite;
    }

    .banner-dots span:nth-child(2) { animation-delay: 4s; }
    .banner-dots span:nth-child(3) { animation-delay: 8s; }

    @keyframes bannerSlide {
      0%, 28% { transform: translateX(0); }
      33%, 61% { transform: translateX(-33.333%); }
      66%, 94% { transform: translateX(-66.666%); }
      100% { transform: translateX(0); }
    }

    @keyframes bannerDot {
      0%, 28% { background: #fff; width: 16px; border-radius: 8px; }
      33%, 100% { background: rgba(255,255,255,0.52); width: 6px; }
    }

    };

    app.selectReducerType = value => {
      state.motorSelections.reducer = value;
      document.querySelectorAll('#motor-reducer .option-card').forEach(el => {
        el.classList.toggle('active', el.dataset.value === value);
      });
      app.updateMotorCount();
    };

    app.adjustMotor = (field, delta) => {
      const el = $(field === 'power' ? 'motor-power' : 'motor-speed');
      let val = parseFloat(el.value) || 0;
      val = Math.max(0, +(val + delta).toFixed(1));
      el.value = val;
    };

    app.showMotorResults = () => {
      if (state.motorStep === 0) return toast('请先点击开始匹配');
      if ((state.motorCount || 0) === 0) return toast('请先选择匹配条件');
      state.motorResults = app.buildMotorResults();
      state.motorCount = state.motorResults.length;
      const countEl = $('motor-count');
      if (countEl) countEl.textContent = state.motorCount;
      const html = `
        <div>
          <div class="font-14 font-bold mb-12">机型推荐（共 ${state.motorResults.length} 款）</div>
          ${state.motorResults.map((r, idx) => `
            <div class="result-card ${idx === 0 ? 'recommended' : ''}">
              <div class="flex justify-between items-center mb-12">
                <div class="font-14 font-bold">${r.model}</div>
                <span class="tag active">使用系数 ${r.score}</span>
              </div>
              <div class="font-12 text-secondary mb-12">${r.series}</div>
              <div class="font-12 text-secondary mb-12">
                ${Object.entries(r.params).map(([k, v]) => `${k}:${v}`).join(' · ')}
              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-outline btn-sm flex-1" onclick="app.closeModal();app.navigate('productDetail',{code:'${r.model}'}, event)">查看详情</button>
                <button class="btn btn-primary btn-sm flex-1" onclick="app.closeModal();app.openWorkOrderPopup('${r.model}', event)">生成需求单</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      app.openModal('匹配结果', html);
    };

    // ===================== Work Order Logic =====================
    app.openWorkOrderPopup = (model, event) => {
      if (event) event.stopPropagation();
      state.aiCurrentModel = model;
      const html = app.workOrderFormHTML('生成需求单', model, false);
      app.openModal('生成需求单', html);
    };

    app.openCustomOrderPopup = event => {
      if (event) event.stopPropagation();
      const html = app.workOrderFormHTML('提交定制需求', '', true);
      app.openModal('提交定制需求', html);
    };

    app.openCreateWorkOrderModal = () => {
      const html = app.workOrderFormHTML('新建需求', '', false);
      app.openModal('新建需求', html);
    };

    app.workOrderFormHTML = (title, model, isCustom) => {
      const extracted = state.aiExtracted || [];
      return `
        <form id="wo-form" onsubmit="event.preventDefault(); app.submitWorkOrder('${model}', ${isCustom});">
          ${isCustom ? `
            <div class="form-group">
              <label class="form-label">AI 整理客户需求</label>
              <div style="background:var(--primary-light);padding:12px;border-radius:var(--radius);">
                ${extracted.length ? extracted.map(k => `<div class="font-13 mb-8">• ${k}</div>`).join('') : '<div class="font-13 text-secondary">未识别到明确参数，请补充描述</div>'}
              </div>
            </div>
          ` : ''}
          ${model ? `
            <div class="form-group">
              <label class="form-label">所选型号</label>
              <div class="tag">${model}</div>
            </div>
          ` : ''}
          <div class="form-group">
            <label class="form-label">需求类型</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${data.workOrderTypes.map((t, idx) => `
                <label class="tag ${(idx === 0 && !isCustom) || (isCustom && t === '定制需求') ? 'active' : 'tag-outline'}" style="cursor:pointer;" onclick="app.selectWOTag(this)">
                  <input type="radio" name="wo-type" value="${t}" ${(idx === 0 && !isCustom) || (isCustom && t === '定制需求') ? 'checked' : ''} style="display:none;">${t}
                </label>
              `).join('')}
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">联系人 <span style="color:var(--error);">*</span></label>
            <input type="text" class="form-input" id="wo-name" placeholder="请输入联系人姓名" value="${state.user ? state.user.name : ''}">
            <div class="error-text" id="wo-name-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label">手机号 <span style="color:var(--error);">*</span></label>
            <input type="tel" class="form-input" id="wo-phone" placeholder="请输入手机号" value="${state.user ? state.user.phone : ''}">
            <div class="error-text" id="wo-phone-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label">公司名称</label>
            <input type="text" class="form-input" id="wo-company" placeholder="请输入公司名称（选填）">
          </div>
          <div class="form-group">
            <label class="form-label">需求描述</label>
            <textarea class="form-textarea" id="wo-desc" placeholder="请输入数量、交货期、特殊要求等"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">上传附件</label>
            <div class="upload-area" onclick="toast('请选择图片文件')">
              <img class="upload-example" src="assets/upload-drawing.svg" alt="上传附件示例">
              <div style="font-size:24px;margin-bottom:4px;">📎</div>
              <div class="font-12">点击上传现场照片/设备铭牌</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">提交</button>
          <div class="text-center mt-12 font-12 text-tertiary">🔒 信息将加密传输，仅销售人员可见</div>
        </form>
      `;
    };

    app.selectWOTag = el => {
      document.querySelectorAll('#wo-form .tag').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('#wo-form .tag').forEach(t => t.classList.add('tag-outline'));
      el.classList.remove('tag-outline');
      el.classList.add('active');
      el.querySelector('input').checked = true;
    };

    app.submitWorkOrder = (model, isCustom) => {
      const name = $('wo-name').value.trim();
      const phone = $('wo-phone').value.trim();
      const company = $('wo-company').value.trim();
      const desc = $('wo-desc').value.trim();
      const typeEl = document.querySelector('input[name="wo-type"]:checked');
      const type = typeEl ? typeEl.value : '询价';

      let valid = true;
      $('wo-name-error').textContent = '';
      $('wo-phone-error').textContent = '';
      $('wo-name').classList.remove('error');
      $('wo-phone').classList.remove('error');

      if (!name) {
        $('wo-name-error').textContent = '请输入联系人姓名';
        $('wo-name').classList.add('error');
        valid = false;
      }
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        $('wo-phone-error').textContent = '请输入正确的手机号';
        $('wo-phone').classList.add('error');
        valid = false;
      }
      if (!valid) return;

      state.workOrders.unshift({
        id: 'WO' + Date.now(),
        title: isCustom ? '定制需求：' + (desc.slice(0, 20) || '非标定制') : (model + ' ' + type),
        model: model || '待确认',
        type: type,
        status: 'pending',
        time: formatDate(),
        msg: ''
      });
      saveState();
      app.closeModal();
      toast('需求提交成功');
      app.navigate('workOrderCenter');
    };

    app.sendWorkOrderMsg = () => {
      const input = $('wo-msg');
      if (!input || !input.value.trim()) return;
      toast('消息已发送');
      input.value = '';
    };

    // ===================== Auth Logic =====================
    app.doLogin = () => {
      const phone = $('auth-phone').value.trim();
      const pwd = $('auth-pwd').value;
      if (!phone || !pwd) return toast('请填写完整信息');
      state.user = { name: '张工', phone: phone, regTime: '2026-08-12' };
      saveState();
      toast('登录成功');
      app.navigate('profile');
    };

    app.nextRegisterStep = () => {
      const phone = $('auth-phone').value.trim();
      const code = $('auth-code').value.trim();
      if (!phone || !code) return toast('请填写手机号和验证码');
      app.navigate('auth', { mode: 'register', step: 2 });
    };

    app.doRegister = () => {
      const phone = $('auth-phone').value.trim();
      const pwd = $('auth-pwd').value;
      const pwd2 = $('auth-pwd2').value;
      const agree = $('agree-check').checked;
      if (!phone || !pwd) return toast('请填写完整信息');
      if (pwd !== pwd2) return toast('两次密码不一致');
      if (!agree) return toast('请同意用户协议');
      state.user = { name: '新用户', phone: phone, regTime: formatDate() };
      saveState();
      app.navigate('auth', { mode: 'register', step: 3 });
    };

    app.doReset = () => {
      const phone = $('auth-phone').value.trim();
      const pwd = $('auth-pwd').value;
      if (!phone || !pwd) return toast('请填写完整信息');
      toast('密码重置成功');
      app.navigate('auth', { mode: 'login' });
    };

    app.logout = () => {
      state.user = null;
      saveState();
      toast('已退出登录');
      app.navigate('profile');
    };

    // ===================== Search =====================
    app.doSearch = () => {
      const input = $('search-input');
      const kw = input ? input.value.trim() : '';
      if (kw) app.searchKeyword(kw);
    };

    app.searchKeyword = kw => {
      if (!state.searchHistory.includes(kw)) {
        state.searchHistory.unshift(kw);
        if (state.searchHistory.length > 10) state.searchHistory.pop();
        saveState();
      }
      toast('搜索结果：' + kw);
      app.navigate('category');
    };

    // ===================== Init =====================
    document.querySelectorAll('.tab-item').forEach(el => {
      el.addEventListener('click', () => app.navigate(el.dataset.page));
    });

    app.render();
  </script>
</body>
</html>
